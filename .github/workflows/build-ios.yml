
name: Build Digital Shop IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project DigitalShop.xcodeproj \
            -scheme DigitalShop \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/DigitalShop.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "DigitalShop.app was not found."
            find build/Build/Products -maxdepth 4 -name "*.app" -print || true
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/DigitalShop.app

          cd ipa
          zip -qry ../DigitalShop-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DigitalShop-Unsigned-IPA
          path: DigitalShop-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
